<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img"
     aria-label="The four boxes, labelled with the real parts on the table">
  <g fill="#E2E7EC" stroke="#12171C" stroke-width="3">
    <rect x="20"  y="55"  width="180" height="115" rx="2"/>
    <rect x="260" y="55"  width="180" height="115" rx="2"/>
    <rect x="500" y="55"  width="180" height="115" rx="2"/>
    <rect x="260" y="310" width="180" height="115" rx="2"/>
  </g>
  <g font-family="ui-monospace, monospace" text-anchor="middle" fill="#12171C">
    <g font-size="23" font-weight="600" letter-spacing="1.5">
      <text x="110" y="105">INPUT</text>
      <text x="350" y="105">PROCESS</text>
      <text x="590" y="105">OUTPUT</text>
      <text x="350" y="360">STORAGE</text>
    </g>
    <g font-size="18" fill="#444F59">
      <text x="110" y="138">the keys</text>
      <text x="110" y="160">the mouse</text>
      <text x="350" y="138">inside the</text>
      <text x="350" y="160">keyboard</text>
      <text x="590" y="149">the monitor</text>
      <text x="350" y="404">the card</text>
    </g>
  </g>
  <g stroke="#444F59" stroke-width="3" fill="none">
    <path d="M200 112 H254"/>
    <path d="M440 112 H494"/>
    <path d="M350 170 V304"/>
  </g>
  <g fill="#444F59">
    <path d="M260 112 l-14 -7 v14 z"/>
    <path d="M500 112 l-14 -7 v14 z"/>
    <path d="M350 310 l-7 -14 h14 z"/><path d="M350 170 l-7 14 h14 z"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="17" fill="#7A868F">
    <text x="227" y="94" text-anchor="middle">USB</text>
    <text x="467" y="94" text-anchor="middle">HDMI</text>
    <text x="366" y="243">in the slot</text>
  </g>
</svg>
